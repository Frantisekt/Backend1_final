spring.application.name=clinica

logging.level.root=INFO
#appender consola
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%highlight(%-5level)] [%cyan(%thread)] %magenta(%logger{15}) - %msg%n

# -----------------MySQL Configuration-------------------
# Configuración de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/clinicadb?useSSL=false&serverTimezone=UTC
spring.datasource.username=clinicadmin
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

