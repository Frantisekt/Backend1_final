spring.application.name=clinica

logging.level.root=INFO

#appender consola
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%highlight(%-5level)] [%cyan(%thread)] %magenta(%logger{15}) - %msg%n

#configuracion de JPA y hibernate
spring.h2.console.enabled=true

#For Mac H2 storage:
spring.datasource.url=jdbc:h2:file:./data/clinicac6

#For Windows: spring.datasource.url=jdbc:h2:/clinica/clinicac6
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop 


